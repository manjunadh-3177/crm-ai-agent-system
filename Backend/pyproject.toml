[project]
name = "acufy-crm-backend"
version = "0.1.0"
description = "Acufy CRM backend"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "PyJWT[crypto]>=2.10.0,<3.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "redis>=5.2.1,<6.0.0",
    "arq>=0.26.3,<1.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "psycopg[binary,pool]>=3.2.3,<4.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langfuse>=2.59.0,<3.0.0",
    "icalendar>=7.0.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
